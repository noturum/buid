name: build-custom-rasterizer

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version of your ComfyUI venv"
        type: choice
        required: true
        default: "3.13"
        options: ["3.10", "3.11", "3.12", "3.13"]
      arch-list:
        description: "TORCH_CUDA_ARCH_LIST"
        type: string
        required: false
        default: "8.9+PTX"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # CUDA 12.8 (nvcc) на windows-latest не предустановлен — ставим toolkit
      - name: Install CUDA 12.8 toolkit
        shell: pwsh
        run: |
          $installer = "cuda_12.8.0_571.96_windows.exe"
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/$installer" -OutFile $installer
          # только нужные компоненты, без драйвера (на раннере нет GPU)
          Start-Process -FilePath ".\$installer" -ArgumentList '/s','/silent','/features=nvcc,visual_studio_integration,cudart,header' -Wait

      - name: Verify nvcc
        shell: cmd
        run: "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\nvcc --version"

      # torch той же версии/cuda, что в твоём venv — чтобы ABI совпал
      - name: Install torch cu128
        shell: pwsh
        run: python -m pip install --upgrade pip && python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128

      # исходники пакета
      - name: Fetch source
        shell: pwsh
        run: git clone --depth 1 https://github.com/kijai/ComfyUI-Hunyuan3DWrapper.git

      # сборка колеса в VS-среде (MSVC)
      - name: Build wheel
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          set "CUDA_HOME=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          set "PATH=%CUDA_HOME%\bin;%PATH%"
          set "TORCH_CUDA_ARCH_LIST=${{ inputs.arch-list }}"
          cd ComfyUI-Hunyuan3DWrapper\hy3dgen\texgen\custom_rasterizer
          python setup.py bdist_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: custom_rasterizer_win
          path: ComfyUI-Hunyuan3DWrapper/hy3dgen/texgen/custom_rasterizer/dist/*.whl
