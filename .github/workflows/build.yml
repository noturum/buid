name: build-custom-rasterizer

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version of your ComfyUI venv"
        type: choice
        required: true
        default: "3.13"
        options: ["3.10", "3.11", "3.12", "3.13"]
      arch-list:
        description: "TORCH_CUDA_ARCH_LIST"
        type: string
        required: false
        default: "8.9"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install CUDA 12.8 toolkit (nvcc only)
        shell: pwsh
        run: |
          $installer = "cuda_12.8.0_571.96_windows.exe"
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/$installer" -OutFile $installer
          Start-Process -FilePath ".\$installer" -ArgumentList '/s','/silent','/features=nvcc,visual_studio_integration,cudart,header' -Wait

      - name: Verify nvcc
        shell: cmd
        run: '"C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\nvcc" --version'

      - name: Install torch cu128 + numpy
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install numpy
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128

      - name: Fetch source
        shell: pwsh
        run: git clone --depth 1 https://github.com/kijai/ComfyUI-Hunyuan3DWrapper.git

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheel
        shell: cmd
        env:
          CUDA_HOME: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
          CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
          TORCH_CUDA_ARCH_LIST: ${{ inputs.arch-list }}
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
        run: |
          set "PATH=%CUDA_HOME%\bin;%PATH%"
          cd ComfyUI-Hunyuan3DWrapper\hy3dgen\texgen\custom_rasterizer
          python setup.py bdist_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: custom_rasterizer_win
          path: ComfyUI-Hunyuan3DWrapper/hy3dgen/texgen/custom_rasterizer/dist/*.whl
          if-no-files-found: error
